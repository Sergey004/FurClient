<!DOCTYPE html><html><body><form class="shout-post-form" name="JSForm" id="JSForm" method="post" action="/user/currentuser/">
                                <div id="c-shoutBox__entry">
                                    <input type="hidden" name="action" value="shout">
                                    <input type="hidden" name="key" value="testkey">
                                    <input type="hidden" name="name" value="currentuser">

                                    <div id="c-shoutBox__container">
                                        <div id="c-shoutbox__avatar">
                                            <a href="/user/currentuser/" class="c-avatarFrameCapable">
                                                <img class="avatar" alt="currentuser" src="//a.furaffinity.net/20261119/currentuser.gif" height="100">
                                                                                            </a>
                                        </div>
                                        <div id="c-shoutBox__input">
                                            <textarea class="bg2 textarea textarearesize" id="JSMessage" name="shout" placeholder="Type here to leave a shout!" minlength="1" maxlength="255"></textarea>
                                        </div>
                                    </div>
                                </div>

                                <div id="c-shoutBox__submitContainer" class="alignright">
                                    <div id="c-shoutBox__counter">
                                        <span id="c-shoutBox__count">0</span>/255                                    </div>
                                    <button id="c-shoutBox__button" class="button standard" type="submit" name="submit" value="Submit">Leave Shout</button>
                                </div>

                            </form></body></html>
