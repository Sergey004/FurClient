name: fa_kit
description: Unofficial FurAffinity API client library for Flutter/Dart. Provides cookie-based authentication, HTML page parsing, and typed models for submissions, journals, notes, users, and more.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  http: ^1.2.0
  html: ^0.15.4
  cookie_jar: ^4.0.8
  path_provider: ^2.1.2
  collection: ^1.18.0
  crypto: ^3.0.3

dev_dependencies:
  lints: ^4.0.0
  test: ^1.25.0
