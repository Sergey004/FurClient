name: furclient
description: "A FurAffinity client"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.0
  shared_preferences: ^2.2.0

  url_launcher: ^6.2.0
  cronet_http: ^1.8.0
  cupertino_http: ^3.0.1
  path_provider: ^2.1.0
  flutter_inappwebview: ^6.0.0
  extended_image: ^8.0.0
  dynamic_color: ^1.7.0
  fluent_ui: ^4.9.1
  system_theme: ^3.0.0
  fa_kit:
      path: ./packages/fa_kit

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
