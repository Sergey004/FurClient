name: Analyze

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  analyze-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Install fa_kit dependencies
        run: flutter pub get
        working-directory: packages/fa_kit

      - name: Run analyzer
        run: flutter analyze

      - name: Run tests
        run: flutter test