name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-web:
    name: Build web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run web:build
      - run: cp web-build/bundle.js electron/bundle.js
      - uses: actions/upload-artifact@v4
        with:
          name: web-bundle
          path: electron/bundle.js
          retention-days: 1

  build-electron:
    name: Electron (${{ matrix.os }})
    needs: build-web
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage
            artifact: FA-Nexus-Linux
            path: dist-electron/*.AppImage
          - os: windows-latest
            target: --win portable
            artifact: FA-Nexus-Windows
            path: dist-electron/*.exe
          - os: macos-latest
            target: --mac dmg --config.mac.identity=null
            artifact: FA-Nexus-macOS
            path: dist-electron/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: web-bundle
          path: electron/

      - run: npm ci

      - name: Build (${{ matrix.os }})
        run: npx electron-builder ${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
