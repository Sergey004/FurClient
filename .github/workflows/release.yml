name: Release

on:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.44.1"
  JAVA_VERSION: "17"
  DOTNET_VERSION: "8.0.x"

jobs:
  # ─── Build & Release Android APK ────────────────────────────────
  release-android:
    name: Release Android
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Rename artifacts
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            furclient-${{ github.ref_name }}-android.apk
          mv build/app/outputs/bundle/release/app-release.aab \
            furclient-${{ github.ref_name }}-android.aab

      - name: Upload Android to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            furclient-${{ github.ref_name }}-android.apk
            furclient-${{ github.ref_name }}-android.aab
          generate_release_notes: true

  # ─── Build & Release Windows (Velopack) ──────────────────────
  release-windows:
    name: Release Windows
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Pack with Velopack
        shell: pwsh
        run: |
           # Velopack expects SemVer format (x.y.z) — remove 'v' prefix and '+' suffix
           $version = "${{ github.ref_name }}".TrimStart('v').Split('+')[0]
           vpk pack `
             --packId "furclient" `
             --packVersion "$version" `
             --packDir "build/windows/x64/runner/Release" `
             --mainExe "furclient.exe" `
             --outputDir "velopack-output"
             
      - name: Upload Velopack assets to release
        uses: softprops/action-gh-release@v3
        with:
          files: velopack-output/*
          generate_release_notes: true
