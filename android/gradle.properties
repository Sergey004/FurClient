org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Kotlin incremental compilation keeps its caches in memory-mapped .tab files
# (build/<plugin>/kotlin/compileDebugKotlin/cacheable/caches-jvm/jvm/kotlin).
# On Windows those files are locked by the Kotlin daemon and cannot be closed
# on shutdown — the build dies with:
#   "Could not close incremental caches ... class-fq-name-to-source.tab"
# (KT-66515). The locks also surface on local Windows machines and on the
# GitHub Actions windows-latest runner, where the build failed on
# :dynamic_color / :cronet_http / :file_selector_android.
# Fix: no incremental Kotlin compilation + compiler runs inside the Gradle
# daemon (no second process holding the same cache files).
kotlin.incremental=false
kotlin.compiler.execution.strategy=in-process
