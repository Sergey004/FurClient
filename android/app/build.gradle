plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.sergey004.furclient"
    compileSdk 37
    ndkVersion = '30.0.16248370'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        multiDexEnabled true
        applicationId = "com.sergey004.furclient"
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
        constraints {
        implementation 'org.chromium.net:cronet-api:143.7445.0'
        implementation 'org.chromium.net:cronet-shared:143.7445.0'
        }
}

configurations.all {
    resolutionStrategy {
        force 'org.chromium.net:cronet-api:143.7445.0'
        force 'org.chromium.net:cronet-shared:143.7445.0'
    }
}

flutter {
    source = "../.."
}
